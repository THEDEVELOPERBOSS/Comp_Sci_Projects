name: Pytest

on:
  push:
    branches:
      - "agentic/pytest-*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest requests tqdm
      - run: python -m pytest "Project 1 and 2/tests" -q
